name: Terraform Plan

on:
  pull_request:
    branches: [dev, main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Terraform Plan (OIDC)
    runs-on: ubuntu-latest
    environment: Secrets
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Get runner IP
        id: ip
        run: echo "ip=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Whitelist runner IP on Key Vault
        run: |
          KV_NAME=$(az keyvault list --query "[?starts_with(name, 'kv-')].name" -o tsv | head -1)
          if [ -n "$KV_NAME" ]; then
            echo "Adding ${{ steps.ip.outputs.ip }} to $KV_NAME firewall"
            az keyvault network-rule add --name "$KV_NAME" --ip-address "${{ steps.ip.outputs.ip }}/32" || true
            sleep 5
          fi

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -var="allowed_ips=[\"${{ steps.ip.outputs.ip }}/32\"]" > plan.txt 2>&1 || true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8').slice(0, 65000);
            const body = '#### Terraform Plan 📖\n' +
              '```\n' + plan + '\n```\n' +
              '*Triggered by @' + process.env.GITHUB_ACTOR + ' on `' + process.env.GITHUB_HEAD_REF + '`*';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Remove runner IP from Key Vault
        if: always()
        run: |
          KV_NAME=$(az keyvault list --query "[?starts_with(name, 'kv-')].name" -o tsv | head -1)
          if [ -n "$KV_NAME" ]; then
            echo "Removing ${{ steps.ip.outputs.ip }} from $KV_NAME firewall"
            az keyvault network-rule remove --name "$KV_NAME" --ip-address "${{ steps.ip.outputs.ip }}/32" || true
          fi

      - name: Fail on Plan Error
        if: steps.plan.outcome == 'failure'
        run: exit 1
